name: strayflag
description: >-
  Scans built iOS/Android release artifacts (Flutter, Unity, React Native,
  native) for leftover debug, mock and unlock switches before App Review sees them.
version: 0.1.0
repository: https://github.com/artonglocke/strayflag
issue_tracker: https://github.com/artonglocke/strayflag/issues
topics: [flutter, unity, ios, app-store, ci]

environment:
  sdk: ^3.5.0

executables:
  strayflag:

dependencies:
  archive: ^4.0.0
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
